name: Daily rebuild

# The activity heatmap is fetched at build time, so the site only shows fresh
# contributions after a deploy. This triggers one production build a day through
# a Vercel Deploy Hook stored as the VERCEL_DEPLOY_HOOK secret.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set, skipping"
            exit 0
          fi
          # --retry covers 429/5xx and honours Retry-After from Vercel
          curl -fsS --retry 4 --retry-delay 30 --retry-max-time 300 -X POST "$HOOK" > /dev/null
          echo "Deploy triggered"
